# Modified for Democena (2026): independent fork naming and configuration.
name: CI

# The recording job is the smoke alarm for the whole package: it exercises the config loader, the
# Playwright config, the overlay, the fixture, ffmpeg and the caption writers in one go. If the
# example still records, democena still works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Nothing beyond dist/ and templates/ may end up in the tarball, and the Dutch working
      # documents in .plan/ least of all.
      - name: Check what would be published
        run: npm pack --dry-run

  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # GitHub-hosted Ubuntu does not ship ffmpeg. Without it the recording still runs and
      # leaves a webm, and the upload below would then find nothing.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify overlay initialization
        run: npm run test:browser

      - name: Record the example
        run: npm run example

      - uses: actions/upload-artifact@v4
        with:
          name: example-recording
          path: |
            examples/basic/output/*.mp4
            examples/basic/output/*.gif
            examples/basic/output/*.vtt
            examples/basic/output/*.md
          if-no-files-found: error

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json
            mcp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run mcp:install
      - run: npm run mcp:test
      - run: npm run studio:install
      - run: npm --prefix studio run typecheck
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:capture
      - run: npm run studio:capture
      - run: node mcp/scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: democena-motion-preview
          include-hidden-files: true
          path: |
            studio/.cache/agent-smoke-*/verification.json
            studio/.cache/agent-smoke-*/jobs/*/output/
          if-no-files-found: error
